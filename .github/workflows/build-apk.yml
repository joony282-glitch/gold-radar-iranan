name: Build Gold Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Extract Android project
        run: |
          unzip -o Gold-Radar-Iran-v0.9.zip -d extracted
          find extracted -name settings.gradle.kts -print

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

               - name: Fix Java and Kotlin targets
            run: |
              FILE=$(find extracted -path '*/app/build.gradle.kts' -print -quit)
              test -n "$FILE"
              sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE"
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$FILE"
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Gold-Radar-Iran-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
