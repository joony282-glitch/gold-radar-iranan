name: Build Gold Radar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o Gold-Radar-Iran-v0.9.zip -d extracted

      - name: Fix Java and Kotlin targets
        run: |
          FILE=$(find extracted -path '*/app/build.gradle.kts' -print -quit)
          test -n "$FILE"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              'android {',
              '''android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }''',
              1
          )

          p.write_text(s)
          print("Java and Kotlin targets updated")
          PY

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle.kts -print -quit)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Gold-Radar-Iran-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
